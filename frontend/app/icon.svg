<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="theme-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagon Shape (Hive) -->
  <path d="M256 32l192 112v224L256 480 64 368V144L256 32z" fill="none" stroke="url(#theme-grad)" stroke-width="28" stroke-linejoin="round" />
  <path d="M256 64l160 92v184L256 432 96 340V156L256 64z" fill="none" stroke="url(#theme-grad)" stroke-width="8" stroke-opacity="0.5" stroke-linejoin="round" />

  <!-- Center Ticket Icon -->
  <g transform="translate(256, 256) rotate(-45) translate(-90, -50)">
    <!-- Ticket Outline -->
    <path d="M0 20 A20 20 0 0 1 20 0 L160 0 A20 20 0 0 1 180 20 L180 30 A15 15 0 0 0 180 70 L180 80 A20 20 0 0 1 160 100 L20 100 A20 20 0 0 1 0 80 L0 70 A15 15 0 0 0 0 30 L0 20 Z" 
          fill="url(#theme-grad)" filter="url(#glow)"/>
    
    <!-- Dashed Line -->
    <line x1="120" y1="10" x2="120" y2="90" stroke="#1A1A1A" stroke-width="6" stroke-dasharray="8 8" />
    
    <!-- Star Hole -->
    <circle cx="50" cy="50" r="15" fill="#1A1A1A" />
  </g>

  <!-- Sparkle/Star -->
  <path d="M360 120 L370 160 L410 170 L370 180 L360 220 L350 180 L310 170 L350 160 Z" fill="url(#theme-grad)" filter="url(#glow)"/>
  <path d="M120 320 L125 340 L145 345 L125 350 L120 370 L115 350 L95 345 L115 340 Z" fill="url(#theme-grad)"/>
</svg>
